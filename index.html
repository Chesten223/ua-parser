<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UA Parser — User Agent String Analyzer</title>
<meta name="description" content="Parse any User Agent string instantly. Detect browser, engine, OS, device type, and bots. Free developer tool.">
<meta property="og:title" content="UA Parser — User Agent String Analyzer">
<meta property="og:description" content="Parse any User Agent string instantly. Detect browser, engine, OS, device type, and bots. Free developer tool.">
<meta property="og:type" content="website">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e5e7eb; min-height: 100vh; line-height: 1.5; }
a { color: #22c55e; text-decoration: none; }

header { padding: 2rem 1rem 1rem; text-align: center; }
header h1 { font-size: 1.75rem; font-weight: 700; color: #fff; }
header p { color: #9ca3af; margin-top: .25rem; font-size: .9rem; }

.container { max-width: 860px; margin: 0 auto; padding: 0 1rem 2rem; }

/* Input area */
.input-section { margin-top: 1.5rem; }
.input-section label { display: block; font-size: .8rem; color: #9ca3af; margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .05em; }
#ua-input { width: 100%; background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: .75rem 1rem; color: #e5e7eb; font-family: 'SF Mono', 'Fira Code', monospace; font-size: .85rem; resize: vertical; min-height: 80px; }
#ua-input:focus { outline: none; border-color: #22c55e; }
.btn-row { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
button { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: .5rem 1rem; color: #e5e7eb; font-size: .85rem; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: #22c55e; background: #1a2332; }
button.primary { background: #22c55e; color: #0a0a0a; border-color: #22c55e; font-weight: 600; }
button.primary:hover { background: #16a34a; border-color: #16a34a; }

/* Current UA bar */
.current-ua { margin-top: 1rem; background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: .75rem 1rem; font-family: 'SF Mono', monospace; font-size: .8rem; color: #9ca3af; word-break: break-all; display: flex; gap: .5rem; align-items: flex-start; }
.current-ua code { flex: 1; }
.current-ua button { flex-shrink: 0; padding: .25rem .6rem; font-size: .75rem; }

/* Results */
.results { margin-top: 1.5rem; display: none; }
.results.visible { display: block; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .75rem; margin-top: .75rem; }
.result-card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: .75rem 1rem; }
.result-card .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin-bottom: .25rem; }
.result-card .value { font-size: 1rem; font-weight: 600; color: #fff; }
.result-card .value.bot { color: #f97316; }
.result-card .value.accent { color: #22c55e; }

/* Raw JSON */
.raw-section { margin-top: 1.5rem; display: none; }
.raw-section.visible { display: block; }
.raw-section summary { cursor: pointer; font-size: .85rem; color: #9ca3af; padding: .5rem 0; }
.raw-section pre { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1rem; font-size: .8rem; color: #d1d5db; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

/* Preset library */
.library { margin-top: 2rem; }
.library h2 { font-size: 1rem; color: #fff; margin-bottom: .75rem; }
.lib-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
.lib-tabs button { font-size: .78rem; padding: .35rem .75rem; }
.lib-tabs button.active { border-color: #22c55e; color: #22c55e; }
.lib-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .5rem; }
.lib-item { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: .5rem .75rem; cursor: pointer; font-size: .8rem; color: #d1d5db; transition: border-color .15s; display: flex; justify-content: space-between; align-items: center; }
.lib-item:hover { border-color: #22c55e; }
.lib-item .name { color: #22c55e; font-weight: 600; flex-shrink: 0; }
.lib-item .ua-preview { color: #6b7280; font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: .5rem; }

/* Toast */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #22c55e; color: #0a0a0a; padding: .5rem 1rem; border-radius: 6px; font-size: .85rem; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

footer { text-align: center; padding: 2rem 1rem; color: #4b5563; font-size: .75rem; }
</style>
</head>
<body>

<header>
  <h1>UA Parser</h1>
  <p>Parse any User Agent string — browser, engine, OS, device, bots</p>
</header>

<div class="container">
  <!-- Current UA -->
  <div class="current-ua">
    <code id="current-ua"></code>
    <button onclick="useCurrentUA()">Use This</button>
  </div>

  <!-- Input -->
  <div class="input-section">
    <label for="ua-input">Paste a User-Agent string</label>
    <textarea id="ua-input" placeholder="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ..."></textarea>
    <div class="btn-row">
      <button class="primary" onclick="parseInput()">Parse</button>
      <button onclick="document.getElementById('ua-input').value='';hideResults()">Clear</button>
      <button onclick="copyJSON()">Copy JSON</button>
      <button onclick="exportJSON()">Export .json</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="result-grid" id="result-grid"></div>
    <details class="raw-section visible" id="raw-section">
      <summary>Raw JSON</summary>
      <pre id="raw-json"></pre>
    </details>
  </div>

  <!-- Preset Library -->
  <div class="library">
    <h2>Common User Agents</h2>
    <div class="lib-tabs" id="lib-tabs"></div>
    <div class="lib-list" id="lib-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>UA Parser — free developer tool. All parsing runs in your browser.</footer>

<script>
// --- Preset UA Library ---
const PRESETS = {
  'Chrome': [
    { name: 'Chrome 125 / Windows 10', ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36' },
    { name: 'Chrome 125 / macOS', ua: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36' },
    { name: 'Chrome 125 / Linux', ua: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36' },
    { name: 'Chrome 125 / Android', ua: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.6422.113 Mobile Safari/537.36' },
  ],
  'Firefox': [
    { name: 'Firefox 126 / Windows 10', ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0' },
    { name: 'Firefox 126 / macOS', ua: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14.5; rv:126.0) Gecko/20100101 Firefox/126.0' },
    { name: 'Firefox 126 / Linux', ua: 'Mozilla/5.0 (X11; Linux x86_64; rv:126.0) Gecko/20100101 Firefox/126.0' },
    { name: 'Firefox 126 / Android', ua: 'Mozilla/5.0 (Android 14; Mobile; rv:126.0) Gecko/126.0 Firefox/126.0' },
  ],
  'Safari': [
    { name: 'Safari 17 / macOS', ua: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15' },
    { name: 'Safari / iPhone', ua: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' },
    { name: 'Safari / iPad', ua: 'Mozilla/5.0 (iPad; CPU OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' },
  ],
  'Edge': [
    { name: 'Edge 125 / Windows 10', ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0' },
    { name: 'Edge 125 / macOS', ua: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0' },
  ],
  'Bots': [
    { name: 'Googlebot', ua: 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' },
    { name: 'Bingbot', ua: 'Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)' },
    { name: 'Slackbot', ua: 'Slackbot-LinkExpanding 1.0 (+https://api.slack.com/robots)' },
    { name: 'Discord Bot', ua: 'Mozilla/5.0 (compatible; Discordbot/2.0; +https://discordapp.com)' },
    { name: 'Twitterbot', ua: 'Twitterbot/1.0' },
    { name: 'facebookexternalhit', ua: 'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)' },
    { name: 'LinkedIn Bot', ua: 'LinkedInBot/1.0 (http://www.linkedin.com/)' },
    { name: 'curl', ua: 'curl/8.7.1' },
  ],
};

// --- Bot Patterns ---
const BOT_PATTERNS = [
  /googlebot/i, /bingbot/i, /yandexbot/i, /baiduspider/i, /duckduckbot/i,
  /slurp/i, /sogou/i, /exabot/i, /facebot/i, /facebookexternalhit/i,
  /ia_archiver/i, /alexabot/i, /mj12bot/i, /ahrefsbot/i, /semrushbot/i,
  /dotbot/i, /rogerbot/i, /seznambot/i, /twitterbot/i, /slackbot/i,
  /discordbot/i, /telegrambot/i, /linkedinbot/i, /pinterestbot/i,
  /applebot/i, /tumblr/i, /vkshare/i, / whatsapp/i,
  /headlesschrome/i, /phantomjs/i, /selenium/i, /puppeteer/i, /playwright/i,
  /^curl\//i, /^wget\//i, /^python-requests/i, /^java\//i, /^httpie\//i,
  /^go-http-client/i, /^node-fetch/i, /^axios/i, /^ruby/i,
  /bot$/i, /spider/i, /crawler/i, /scraper/i,
];

// --- Parser ---
function parseUA(ua) {
  if (!ua || !ua.trim()) return null;
  ua = ua.trim();

  const result = {
    userAgent: ua,
    browser: { name: 'Unknown', version: '' },
    engine: { name: 'Unknown', version: '' },
    os: { name: 'Unknown', version: '' },
    device: { type: 'Desktop', brand: '' },
    isBot: false,
    botName: '',
  };

  // Bot detection first
  for (const pat of BOT_PATTERNS) {
    const m = ua.match(pat);
    if (m) {
      result.isBot = true;
      result.botName = m[0];
      result.device.type = 'Bot';
      break;
    }
  }

  // Engine
  if (/AppleWebKit\/([\d.]+)/.test(ua)) {
    result.engine.name = 'WebKit';
    result.engine.version = ua.match(/AppleWebKit\/([\d.]+)/)[1];
    if (/Chrome\/([\d.]+)/.test(ua)) {
      result.engine.name = 'Blink';
    }
  } else if (/Gecko\/([\d.]+)/.test(ua)) {
    result.engine.name = 'Gecko';
    const rv = ua.match(/rv:([\d.]+)/);
    if (rv) result.engine.version = rv[1];
  } else if (/Trident\/([\d.]+)/.test(ua)) {
    result.engine.name = 'Trident';
    result.engine.version = ua.match(/Trident\/([\d.]+)/)[1];
  } else if (/Presto\/([\d.]+)/.test(ua)) {
    result.engine.name = 'Presto';
    result.engine.version = ua.match(/Presto\/([\d.]+)/)[1];
  }

  // OS
  if (/Windows NT ([\d.]+)/.test(ua)) {
    result.os.name = 'Windows';
    const v = ua.match(/Windows NT ([\d.]+)/)[1];
    const map = { '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7', '6.0': 'Vista', '5.1': 'XP' };
    result.os.version = map[v] || v;
  } else if (/Mac OS X ([\d_]+)/.test(ua)) {
    result.os.name = 'macOS';
    result.os.version = ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g, '.');
  } else if (/Android ([\d.]+)/.test(ua)) {
    result.os.name = 'Android';
    result.os.version = ua.match(/Android ([\d.]+)/)[1];
  } else if (/iPhone OS ([\d_]+)/.test(ua)) {
    result.os.name = 'iOS';
    result.os.version = ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g, '.');
  } else if (/iPad.*OS ([\d_]+)/.test(ua)) {
    result.os.name = 'iOS';
    result.os.version = ua.match(/iPad.*OS ([\d_]+)/)[1].replace(/_/g, '.');
  } else if (/CrOS/.test(ua)) {
    result.os.name = 'ChromeOS';
  } else if (/Linux/.test(ua)) {
    result.os.name = 'Linux';
  }

  // Browser
  const browserTests = [
    [/Edg\/([\d.]+)/, 'Edge'],
    [/OPR\/([\d.]+)/, 'Opera'],
    [/Vivaldi\/([\d.]+)/, 'Vivaldi'],
    [/SamsungBrowser\/([\d.]+)/, 'Samsung Internet'],
    [/UCBrowser\/([\d.]+)/, 'UC Browser'],
    [/Firefox\/([\d.]+)/, 'Firefox'],
    [/FxiOS\/([\d.]+)/, 'Firefox'],
    [/Version\/([\d.]+).*Safari\//, 'Safari'],
    [/Chrome\/([\d.]+)/, 'Chrome'],
    [/CriOS\/([\d.]+)/, 'Chrome'],
    [/Safari\/([\d.]+)/, 'Safari'],
  ];

  // Bot identity as browser name
  if (result.isBot && !result.botName.match(/bot$/i) && !result.botName.match(/spider|crawler|scraper/i)) {
    // capitalize
    result.browser.name = result.botName.charAt(0).toUpperCase() + result.botName.slice(1);
  }

  for (const [re, name] of browserTests) {
    const m = ua.match(re);
    if (m) {
      result.browser.name = name;
      result.browser.version = m[1];
      break;
    }
  }

  // Device type
  if (!result.isBot) {
    if (/Mobile/i.test(ua) || /iPhone/.test(ua) || /Android.*Mobile/.test(ua)) {
      result.device.type = 'Mobile';
    } else if (/iPad/.test(ua) || /Tablet/.test(ua)) {
      result.device.type = 'Tablet';
    } else if (/Android/.test(ua) && !/Mobile/.test(ua)) {
      result.device.type = 'Tablet';
    } else {
      result.device.type = 'Desktop';
    }
  }

  // Device brand hints
  if (/iPhone/.test(ua)) result.device.brand = 'Apple';
  else if (/iPad/.test(ua)) result.device.brand = 'Apple';
  else if (/Macintosh/.test(ua)) result.device.brand = 'Apple';
  else if (/Pixel/.test(ua)) result.device.brand = 'Google';
  else if (/Samsung/.test(ua)) result.device.brand = 'Samsung';
  else if (/Galaxy/.test(ua)) result.device.brand = 'Samsung';

  return result;
}

// --- Rendering ---
let lastResult = null;

function renderResult(r) {
  if (!r) return;
  lastResult = r;
  const grid = document.getElementById('result-grid');
  const cards = [
    { label: 'Browser', value: `${r.browser.name} ${r.browser.version}`.trim(), accent: true },
    { label: 'Engine', value: `${r.engine.name} ${r.engine.version}`.trim() },
    { label: 'Operating System', value: `${r.os.name} ${r.os.version}`.trim() },
    { label: 'Device Type', value: r.device.type, accent: r.device.type !== 'Desktop', cls: r.isBot ? 'bot' : '' },
  ];
  if (r.device.brand) cards.push({ label: 'Device Brand', value: r.device.brand });
  if (r.isBot) cards.push({ label: 'Bot Detected', value: r.botName, cls: 'bot' });

  grid.innerHTML = cards.map(c =>
    `<div class="result-card">
      <div class="label">${c.label}</div>
      <div class="value${c.accent ? ' accent' : ''}${c.cls ? ' ' + c.cls : ''}">${escHtml(c.value)}</div>
    </div>`
  ).join('');

  document.getElementById('raw-json').textContent = JSON.stringify(r, null, 2);
  document.getElementById('results').classList.add('visible');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseInput() {
  const ua = document.getElementById('ua-input').value;
  if (!ua.trim()) return;
  renderResult(parseUA(ua));
}

function useCurrentUA() {
  document.getElementById('ua-input').value = navigator.userAgent;
  parseInput();
}

function hideResults() {
  document.getElementById('results').classList.remove('visible');
  lastResult = null;
}

function copyJSON() {
  if (!lastResult) { showToast('Parse a UA first'); return; }
  navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2)).then(() => showToast('Copied!'));
}

function exportJSON() {
  if (!lastResult) { showToast('Parse a UA first'); return; }
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ua-parsed.json';
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// --- Preset Library ---
let activeTab = Object.keys(PRESETS)[0];

function renderLibrary() {
  const tabs = document.getElementById('lib-tabs');
  tabs.innerHTML = Object.keys(PRESETS).map(k =>
    `<button class="${k === activeTab ? 'active' : ''}" onclick="setLibTab('${k}')">${k}</button>`
  ).join('');

  const list = document.getElementById('lib-list');
  list.innerHTML = PRESETS[activeTab].map(p =>
    `<div class="lib-item" onclick="usePreset(${escAttr(JSON.stringify(p.ua))})">
      <span class="name">${escHtml(p.name)}</span>
      <span class="ua-preview">${escHtml(p.ua)}</span>
    </div>`
  ).join('');
}

function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function setLibTab(tab) {
  activeTab = tab;
  renderLibrary();
}

function usePreset(ua) {
  document.getElementById('ua-input').value = ua;
  parseInput();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Init ---
document.getElementById('current-ua').textContent = navigator.userAgent;
renderLibrary();

// Auto-parse current UA on load
document.getElementById('ua-input').value = navigator.userAgent;
parseInput();

// Allow Ctrl+Enter to parse
document.getElementById('ua-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); parseInput(); }
});
</script>
</body>
</html>
